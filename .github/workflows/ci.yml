name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, ruby: "3.1" }
          - { name: Linux, os: ubuntu-latest, ruby: "3.2" }
          - { name: Linux, os: ubuntu-latest, ruby: "3.3" }
          - { name: Linux, os: ubuntu-latest, ruby: "3.4" }
          - { name: macOS, os: macos-latest, ruby: "3.4" }
          - { name: x64-mingw-ucrt, os: windows-latest, ruby: "3.4" }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake compile:test test
      - run: bundle exec rake test:compile_fail
      - run: bundle exec rake amalgamate:check amalgamate:smoke

  ruby-head:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake compile:test test
      - run: bundle exec rake amalgamate:check

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:use_sigaltstack=0
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run ASAN and UBSAN tests
        run: |
          libasan_path="$(gcc -print-file-name=libasan.so)"
          libstdcxx_path="$(g++ -print-file-name=libstdc++.so.6)"
          export LD_PRELOAD="${libasan_path}:${libstdcxx_path}"
          bundle exec rake compile:test
          for test_file in test/ruby/test_*.rb; do
            echo "::group::$test_file"
            bundle exec ruby -Ilib -Itmp/test_extensions "$test_file"
            RBXX_GC_STRESS=1 bundle exec ruby -Ilib -Itmp/test_extensions "$test_file"
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: bundle exec rake lint
        env:
          CLANG_FORMAT: clang-format-18

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y clangd doxygen graphviz zlib1g-dev
      - run: bundle exec rake precompiled:dry_run
      - run: cmake -S examples/cmake-demo -B tmp/cmake-demo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build tmp/cmake-demo
      - run: clangd --check=examples/cmake-demo/cmake_demo.cpp --compile-commands-dir=tmp/cmake-demo
      - run: bundle exec rake bench:run
      - run: bundle exec rake bench:compile_time
      - run: bundle exec rake docs examples:smoke

  clang:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake compile:test test

  msvc-headers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: mswin
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: pwsh
        run: |
          $rubyHeader = ruby -rrbconfig -e "print RbConfig::CONFIG['rubyhdrdir']"
          $rubyArchHeader = ruby -rrbconfig -e "print RbConfig::CONFIG['rubyarchhdrdir']"
          cl /nologo /std:c++20 /EHsc /utf-8 /Iinclude /I"$rubyHeader" /I"$rubyArchHeader" /Zs test/cpp/smoke.cpp

  precompiled-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build precompiled extension image
        run: |
          for attempt in 1 2 3; do
            if docker build \
              --file .github/docker/rake-compiler-dock-gcc12.Dockerfile \
              --tag rbxx-rake-compiler-dock:gcc12 \
              .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Docker build attempt $attempt failed; retrying"
            sleep "$((attempt * 5))"
          done
      - run: bundle exec rake precompiled:x86_64-linux
        env:
          RCD_IMAGE: rbxx-rake-compiler-dock:gcc12
